server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── React SPA — client-side routing ──────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API proxy ─────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://server:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Auth routes (no prefix strip needed) ─────────────────────────────────
    location /auth/ {
        proxy_pass         http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ── WebSocket proxy (real-time chat) ──────────────────────────────────────
    location /ws/ {
        proxy_pass         http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # ── Template portal (served directly by backend static mount) ────────────
    location /template-portal/ {
        proxy_pass         http://server:8000/template-portal/;
        proxy_http_version 1.1;
        proxy_set_header   Host  $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # ── Nyaya-AI client (forwarded to nyaya-ai container on port 5174) ───────
    location /nyaya-ai/ {
        proxy_pass         http://nyaya-ai:80/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── Static asset caching ──────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;
}
