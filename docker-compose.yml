services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    expose:
      - "8000"
    env_file:
      - ./server/.env
    volumes:
      - ./server/legal_services.db:/app/legal_services.db
      - ./server/chroma_db:/app/chroma_db
      - ./shared:/app/../shared          # template portal access
    environment:
      - NODE_ENV=production
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_URL=sqlite:////app/legal_services.db
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5174}
    depends_on:
      mongodb:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  # ── Main React Platform (nginx reverse proxy on port 80) ────────────────────
  platform:
    build:
      context: ./client/platform
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
        - VITE_ASSISTANT_URL=${VITE_ASSISTANT_URL:-http://localhost:5174}
    ports:
      - "80:80"
      # Uncomment for HTTPS (needs SSL certs mounted):
      # - "443:443"
    depends_on:
      - server
      - assistant
    restart: unless-stopped

  # ── Assistant Client (static vanilla-JS legal assistant on port 5174) ────────
  assistant:
    build:
      context: ./client/assistant
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost
    ports:
      - "5174:80"
    depends_on:
      - server
    restart: unless-stopped

  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_DATABASE=legal_services
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
 
  # ── Ollama AI ────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # ── n8n Workflow Automation ──────────────────────────────────────────────────
  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  mongodb_data:
  n8n_data:
  ollama_data:
