name: CI — Nyaya-AI Ecosystem

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend (Python / FastAPI) ──────────────────────────────────────────────
  backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r server/requirements.txt

      - name: Run tests
        run: pytest server/tests/ -v --cov=server
        continue-on-error: true   # don't block CI if tests dir doesn't exist yet

      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check server/
        continue-on-error: true

  # ── Frontend (React / TypeScript) ──────────────────────────────────────────
  frontend:
    name: Frontend Build & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client/platform/package-lock.json

      - name: Install dependencies
        run: cd client/platform && npm ci

      - name: TypeScript check
        run: cd client/platform && npx tsc --noEmit

      - name: Run tests
        run: cd client/platform && npm test -- --watchAll=false
        continue-on-error: true   # don't block CI if tests don't exist yet

      - name: Build production bundle
        run: cd client/platform && npm run build

  # ── Nyaya-AI Static Client ──────────────────────────────────────────────────
  nyaya-ai:
    name: Nyaya-AI Client Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML structure
        run: |
          if [ ! -f client/nyaya-ai/index.html ]; then
            echo "index.html missing!" && exit 1
          fi
          echo "index.html found ✓"
